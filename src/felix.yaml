---
variant: flatcar
version: 1.1.0
kernel_arguments:
  should_exist:
    - ipv6.disable=1
storage:
  filesystems:
    - device: /dev/disk/by-id/virtio-appdata
      format: ext4
      path: /mnt/appdata
      wipe_filesystem: true
      with_mount_unit: true
      label: appdata
    - device: /dev/disk/by-id/virtio-containerd
      format: ext4
      path: /var/lib/containerd
      wipe_filesystem: true
      with_mount_unit: true
      label: containerd
    - device: /dev/disk/by-id/virtio-docker
      format: ext4
      path: /var/lib/docker
      wipe_filesystem: true
      with_mount_unit: true
      label: docker
  directories:
    # Units dropped here are linked+enabled at boot by link-appdata-services.service
    - path: /mnt/appdata/systemd-units
      mode: 0755
    - path: /mnt/appdata/adguard2
      mode: 0755
    - path: /mnt/appdata/adguard2/conf
      mode: 0775
      group:
        id: 3553
    - path: /mnt/appdata/adguard2/work
      mode: 0775
      group:
        id: 3553
  files:
    - path: /etc/hostname
      mode: 0644
      contents:
        inline: felix
    - path: /etc/systemd/network/static.network
      mode: 0644
      contents:
        local: network.config
#   - path: /etc/fstab
#     mode: 0644
#     append:
#       - inline: |
#           10.10.1.99:/media /media nfs defaults,noauto,noatime,nofail,_netdev 0 0
    - path: /etc/sysctl.d/99-keepalived-vrrp.conf
      contents:
        inline: |
          net.ipv4.ip_nonlocal_bind = 1
    - path: /home/core/.bashrc
      overwrite: true
      contents:
        local: bashrc
      group:
        name: core
      user:
        name: core
    - path: /home/will/.bashrc
      overwrite: true
      contents:
        local: bashrc
      group:
        name: will
      user:
        name: will
    - path: /root/.bashrc
      overwrite: true
      contents:
        local: bashrc_root
    - path: /etc/sysupdate.d/noop.conf
      contents:
        source: https://extensions.flatcar.org/extensions/noop.conf
    - path: /opt/extensions/docker-compose/docker-compose-5.3.1-x86-64.raw
      mode: 0644
      contents:
        source: http://extensions.flatcar.org/extensions/docker-compose-5.3.1-x86-64.raw
    - path: /etc/sysupdate.docker-compose.d/docker-compose.conf
      contents:
        source: https://extensions.flatcar.org/extensions/docker-compose.conf
    - path: /opt/extensions/keepalived/keepalived-v2.4.2-x86-64.raw
      mode: 0644
      contents:
        source: https://extensions.flatcar.org/extensions/keepalived-v2.4.2-x86-64.raw
    - path: /etc/sysupdate.keepalived.d/keepalived.conf
      contents:
        source: https://extensions.flatcar.org/extensions/keepalived.conf
    - path: /etc/keepalived/keepalived.conf
      mode: 0644
      contents:
        local: keepalived.conf
    - path: /etc/default/keepalived
      mode: 0644
      contents:
        inline: |
          # Options to pass to keepalived

          # DAEMON_ARGS are appended to the keepalived command-line
          # DAEMON_ARGS=""
    # --- AdGuard: unit, compose file and config live on the persistent appdata disk.
    # overwrite: true so a reinstall onto an existing appdata disk succeeds
    # (Ignition fails on pre-existing files otherwise). The work/ dir is left alone.
    - path: /mnt/appdata/systemd-units/adguard2.service
      mode: 0644
      overwrite: true
      contents:
        local: adguard2.service
    - path: /mnt/appdata/adguard2/compose.yaml
      mode: 0644
      overwrite: true
      contents:
        local: adguard-compose.yaml
    - path: /mnt/appdata/adguard2/conf/AdGuardHome.yaml
      group:
        id: 3553
      mode: 0664
      overwrite: true
      contents:
        local: AdGuardHome.yaml

  links:
    - target: /opt/extensions/docker-compose/docker-compose-5.3.1-x86-64.raw
      path: /etc/extensions/docker-compose.raw
      hard: false
    - target: /opt/extensions/keepalived/keepalived-v2.4.2-x86-64.raw
      path: /etc/extensions/keepalived.raw
      hard: false
    - target: /usr/share/zoneinfo/America/Denver
      path: /etc/localtime
      overwrite: true


systemd:
  units:
    - name: containerd.service
      dropins:
        - name: 10-felix-mounts.conf
          contents: |
            [Unit]
            RequiresMountsFor=/var/lib/containerd
            After=var-lib-containerd.mount
    - name: docker.service
      dropins:
        - name: 10-felix-mounts.conf
          contents: |
            [Unit]
            RequiresMountsFor=/var/lib/docker
            RequiresMountsFor=/var/lib/containerd
            After=var-lib-docker.mount var-lib-containerd.mount
    - name: link-appdata-services.service
      enabled: true
      contents: |
        [Unit]
        Description=Link and enable persistent systemd units (for Docker containers)
        RequiresMountsFor=/mnt/appdata
        RequiresMountsFor=/var/lib/docker
        Wants=docker.service
        After=var-lib-docker.mount docker.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        # "systemctl enable <abs path>" links the unit into /etc/systemd/system and
        # enables it in one step; it is idempotent on reboot (systemctl link is not).
        # --now also starts it.
        ExecStart=/bin/bash -c 'for f in /mnt/appdata/systemd-units/*.service; do [ -f "$f" ] && systemctl enable --now "$f"; done; true'

        [Install]
        WantedBy=multi-user.target
    - name: adguard2.service
      dropins:
        - name: 10-felix-mounts.conf
          contents: |
            [Unit]
            RequiresMountsFor=/var/lib/docker
            After=var-lib-docker.mount
    - name: keepalived.service
      dropins:
        - name: 20-ordering.conf
          contents: |
            [Unit]
            After=adguard2.service
    - name: systemd-sysupdate.timer
      enabled: true
    - name: systemd-sysupdate.service
      dropins:
        - name: docker-compose.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/docker-compose.raw > /tmp/docker-compose"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C docker-compose update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/docker-compose.raw > /tmp/docker-compose-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/docker-compose /tmp/docker-compose-new; then touch /run/reboot-required; fi"
        - name: keepalived.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/keepalived.raw > /tmp/keepalived"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C keepalived update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/keepalived.raw > /tmp/keepalived-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/keepalived /tmp/keepalived-new; then touch /run/reboot-required; fi"

passwd:
  groups:
    - name: adguard
      gid: 3553
    - name: will
      gid: 8008
  users:
    - name: adguard
      uid: 3553
      primary_group: adguard
      no_create_home: true
      shell: /sbin/nologin
    - name: will
      uid: 8008
      primary_group: will
      ssh_authorized_keys:
        - "@@LAPTOP_PUBLIC_KEY@@"
        - "@@DESKTOP_PUBLIC_KEY@@"
        - "@@SERVER_PUBLIC_KEY@@"
    - name: core
      ssh_authorized_keys:
        - "@@LAPTOP_PUBLIC_KEY@@"
        - "@@DESKTOP_PUBLIC_KEY@@"
        - "@@SERVER_PUBLIC_KEY@@"
