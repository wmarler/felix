# keepalived is used exclusively for adguard DNS on 10.10.1.10 right now
# adguard1 is the raspberry pi with real IP 10.10.1.9 and is the primary;
# the container instance here is only for failover case.

global_defs {
  vrrp_version 3
  enable_script_security
  max_auto_priority
}

vrrp_script check_dns {
  script "/usr/bin/dig +short +time=1 +tries=1 @10.10.1.12 keepalived.health.check"
  interval 1
  timeout 2
  fall 2
  rise 2
  user core
}

vrrp_track_process proc_adguard {
  process"AdGuardHome"
  quorum 1
}

vrrp_instance VI_1 {
  state BACKUP
  interface eth1
  virtual_router_id 51
  priority 90
  advert_int 0.2

  authentication {
    auth_type PASS
    auth_pass @@VRRP_PASSWORD@@
  }

  virtual_ipaddress {
    10.10.1.10/24
  }

  track_process {
    proc_adguard
  }

  track_script {
    check_dns
  }
}
