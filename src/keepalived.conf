# keepalived is used exclusively for adguard DNS on 10.10.1.10 right now
# adguard1 is the raspberry pi with real IP 10.10.1.9 and is the primary;
# the container instance here is only for failover case.

global_defs {
  enable_script_security
  max_auto_priority
}

vrrp_script_check_dns {
  script "/usr/bin/dig +short @10.10.1.12 localhost || exit 1"
  interval 2
  weight 20
  fall 2
  rise 2
  user keepalived_script
}

vrrp_instance VI_1 {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 90
  advert_int 1

  authentication {
    auth_type PASS
    auth_pass @@VRRP_PASSWORD@@
  }

  virtual_ipaddress {
    10.10.1.10/24
  }

  track_script {
    check_dns
  }
}
